# ─────────────────────────────────────────────────────────────
# VECTRIX · cargo-deny policy
# SPDX-License-Identifier: MIT
# ─────────────────────────────────────────────────────────────
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
